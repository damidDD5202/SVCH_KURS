<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FDFA"/>
      <stop offset="0.45" stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="120" x2="1040" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#06B6D4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="blur" x="-200" y="-200" width="1600" height="1200" filterUnits="userSpaceOnUse">
